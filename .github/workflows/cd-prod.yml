name: CD - Prod

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      app_version:
        description: "Version label (commit SHA or tag) for the package."
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.5"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build prod zip
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compute version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.app_version }}" ]; then
            v="${{ github.event.inputs.app_version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "app_version=$v" >> "$GITHUB_OUTPUT"
          echo "artifact_name=brasov-sunset-api-$v" >> "$GITHUB_OUTPUT"

      - name: Install production dependencies
        working-directory: App
        run: npm install --omit=dev --no-audit --no-fund

      - name: Stamp APP_VERSION into package.json
        working-directory: App
        run: |
          tmp=$(mktemp)
          jq --arg v "${{ steps.meta.outputs.app_version }}" '.version=$v' package.json > "$tmp" && mv "$tmp" package.json

      - name: Create zip package
        working-directory: App
        run: |
          zip -r "../${{ steps.meta.outputs.artifact_name }}.zip" \
              server.js package.json package-lock.json node_modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.artifact_name }}.zip
          retention-days: 90

  deploy:
    name: Terraform apply + slot deploy + swap (prod)
    runs-on: ubuntu-latest
    needs: [build]
    environment: prod
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    env:
      TF_VAR_app_version: ${{ needs.build.outputs.app_version }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployer object id
        id: sp
        run: |
          oid=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config=resource_group_name=${{ secrets.TFSTATE_RG }} \
            -backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE }} \
            -backend-config=container_name=tfstate \
            -backend-config=key=envs/prod.tfstate \
            -backend-config=use_oidc=true \
            -backend-config=use_azuread_auth=true

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var 'deployer_principal_ids=["${{ steps.sp.outputs.oid }}"]'

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Capture outputs
        id: tfout
        run: |
          echo "app_url=$(terraform output -raw app_url)"               >> "$GITHUB_OUTPUT"
          echo "staging_url=$(terraform output -raw staging_slot_url)"  >> "$GITHUB_OUTPUT"
          echo "app_name=$(terraform output -raw app_name)"             >> "$GITHUB_OUTPUT"
          echo "rg=$(terraform output -raw resource_group)"             >> "$GITHUB_OUTPUT"

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ github.workspace }}/pkg

      - name: Deploy zip to staging slot
        run: |
          az webapp deploy \
            --resource-group "${{ steps.tfout.outputs.rg }}" \
            --name "${{ steps.tfout.outputs.app_name }}" \
            --slot staging \
            --src-path "${{ github.workspace }}/pkg/${{ needs.build.outputs.artifact_name }}.zip" \
            --type zip \
            --async false

      - name: Smoke test staging slot
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.tfout.outputs.staging_url }}"
          for path in /healthz /readyz /sunset; do
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -fsS -o /tmp/resp -w "%{http_code}" "${base}${path}" || echo "000")
              if [ "$code" = "200" ]; then ok=1; cat /tmp/resp; echo; break; fi
              echo "attempt $i: HTTP $code"; sleep 15
            done
            test "$ok" -eq 1
          done

      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ steps.tfout.outputs.rg }}" \
            --name "${{ steps.tfout.outputs.app_name }}" \
            --slot staging \
            --target-slot production

      - name: Smoke test production after swap
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.tfout.outputs.app_url }}"
          for path in /healthz /readyz /sunset; do
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -fsS -o /tmp/resp -w "%{http_code}" "${base}${path}" || echo "000")
              if [ "$code" = "200" ]; then ok=1; cat /tmp/resp; echo; break; fi
              echo "attempt $i: HTTP $code"; sleep 15
            done
            test "$ok" -eq 1
          done
