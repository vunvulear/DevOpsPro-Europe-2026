name: CD - Prod

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote (must already exist in dev ACR)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.5"
  IMAGE_NAME: brasov-sunset-api
  ACR_DEV: acrsunsetapidev
  ACR_PROD: acrsunsetapiprod

jobs:
  promote:
    name: Promote image dev -> prod ACR
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      acr_server: ${{ steps.acr.outputs.server }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            tag="${{ github.event.inputs.image_tag }}"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve prod ACR
        id: acr
        run: |
          server=$(az acr show -n "$ACR_PROD" --query loginServer -o tsv)
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: Import image from dev ACR to prod ACR
        run: |
          az acr import \
            --name "$ACR_PROD" \
            --source "$ACR_DEV.azurecr.io/${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
            --image  "${IMAGE_NAME}:${{ steps.meta.outputs.tag }}" \
            --image  "${IMAGE_NAME}:prod-latest" \
            --force

      - name: Trivy scan (prod-promoted)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image-prod.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-prod.sarif

      - name: Verify cosign signature
        uses: sigstore/cosign-installer@v3
      - name: cosign verify
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/cd-dev.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"

  deploy:
    name: Terraform apply + smoke test (prod)
    runs-on: ubuntu-latest
    needs: [promote]
    environment: prod
    defaults:
      run:
        working-directory: infra/terraform/envs/prod
    env:
      TF_VAR_image_tag: ${{ needs.promote.outputs.image_tag }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployer object id
        id: sp
        run: |
          oid=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config=resource_group_name=${{ secrets.TFSTATE_RG }} \
            -backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE }} \
            -backend-config=container_name=tfstate \
            -backend-config=key=envs/prod.tfstate \
            -backend-config=use_oidc=true \
            -backend-config=use_azuread_auth=true

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var 'deployer_principal_ids=["${{ steps.sp.outputs.oid }}"]'

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Capture outputs
        id: tfout
        run: |
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
          echo "ca_name=$(terraform output -raw container_app)" >> "$GITHUB_OUTPUT"
          echo "rg=$(terraform output -raw resource_group)" >> "$GITHUB_OUTPUT"

      - name: Roll Container App revision
        run: |
          az containerapp update \
            --name "${{ steps.tfout.outputs.ca_name }}" \
            --resource-group "${{ steps.tfout.outputs.rg }}" \
            --image "${{ needs.promote.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${{ needs.promote.outputs.image_tag }}"

      - name: Smoke test endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.tfout.outputs.app_url }}"
          for path in /healthz /readyz /sunset; do
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -fsS -o /tmp/resp -w "%{http_code}" "${base}${path}" || echo "000")
              if [ "$code" = "200" ]; then ok=1; cat /tmp/resp; echo; break; fi
              echo "attempt $i: HTTP $code"; sleep 10
            done
            test "$ok" -eq 1
          done
