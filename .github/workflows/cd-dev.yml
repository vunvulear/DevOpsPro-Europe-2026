name: CD - Dev

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "App_Test/**"
      - "infra/terraform/**"
      - ".github/workflows/cd-dev.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write
  security-events: write

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.5"
  ENVIRONMENT: dev
  IMAGE_NAME: brasov-sunset-api
  ACR_NAME: acrsunsetapidev

jobs:
  build:
    name: Build, scan, sign and push image
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_digest: ${{ steps.bp.outputs.digest }}
      acr_server: ${{ steps.acr.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR
        id: acr
        run: |
          server=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          echo "server=$server" >> "$GITHUB_OUTPUT"

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: bp
        uses: docker/build-push-action@v6
        with:
          context: ./App
          file: ./App/Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:dev-latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.meta.outputs.tag }}
          path: sbom.spdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign (keyless)
        run: |
          cosign sign --yes \
            "${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}@${{ steps.bp.outputs.digest }}"

      - name: Cosign attest SBOM
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}@${{ steps.bp.outputs.digest }}"

  deploy:
    name: Terraform apply + smoke test
    runs-on: ubuntu-latest
    needs: [build]
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    env:
      TF_VAR_image_tag: ${{ needs.build.outputs.image_tag }}
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve deployer object id
        id: sp
        run: |
          oid=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config=resource_group_name=${{ secrets.TFSTATE_RG }} \
            -backend-config=storage_account_name=${{ secrets.TFSTATE_STORAGE }} \
            -backend-config=container_name=tfstate \
            -backend-config=key=envs/dev.tfstate \
            -backend-config=use_oidc=true \
            -backend-config=use_azuread_auth=true

      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var 'deployer_principal_ids=["${{ steps.sp.outputs.oid }}"]'

      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Capture outputs
        id: tfout
        run: |
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
          echo "ca_name=$(terraform output -raw container_app)" >> "$GITHUB_OUTPUT"
          echo "rg=$(terraform output -raw resource_group)" >> "$GITHUB_OUTPUT"

      - name: Roll Container App revision to new image
        run: |
          az containerapp update \
            --name "${{ steps.tfout.outputs.ca_name }}" \
            --resource-group "${{ steps.tfout.outputs.rg }}" \
            --image "${{ needs.build.outputs.acr_server }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"

      - name: Smoke test endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.tfout.outputs.app_url }}"
          for path in /healthz /readyz /sunset; do
            echo "GET ${base}${path}"
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -fsS -o /tmp/resp -w "%{http_code}" "${base}${path}" || echo "000")
              if [ "$code" = "200" ]; then
                ok=1
                cat /tmp/resp
                echo
                break
              fi
              echo "attempt $i: HTTP $code, retrying in 10s..."
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "Smoke test failed for $path"
              exit 1
            fi
          done
