name: CI

# Build & test the Brasov Sunset API on every PR and on pushes to main.
# Demo-friendly: one job, no secrets, no deployment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            App/package-lock.json
            App_Test/package-lock.json

      - name: Install app dependencies
        working-directory: App
        run: npm ci

      - name: Install test dependencies
        working-directory: App_Test
        run: npm ci

      - name: Run tests (Jest + Supertest)
        working-directory: App_Test
        run: npm test
