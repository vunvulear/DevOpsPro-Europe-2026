name: CI

on:
  pull_request:
    branches: [main, prompt_only]
  push:
    branches: [main, prompt_only]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            App/package-lock.json
            App_Test/package-lock.json

      - name: Install app dependencies
        working-directory: App
        run: npm ci

      - name: Install test dependencies
        working-directory: App_Test
        run: npm ci

      - name: Run tests
        working-directory: App_Test
        run: npm test
