# CI - install + test the Brasov Sunset API on every PR. No secrets, no Azure auth.
# Task: T2.1 (specs/golden-path/tasks.md). Constitution: P-III, P-IV.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            App/package-lock.json
            App_Test/package-lock.json

      - name: Install App dependencies
        run: npm ci
        working-directory: App

      - name: Install test dependencies
        run: npm ci
        working-directory: App_Test

      - name: Run tests
        run: npm test
        working-directory: App_Test
