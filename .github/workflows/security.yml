name: Security

on:
  pull_request:
    branches: [main, prompt_only]
  push:
    branches: [main, prompt_only]
  schedule:
    # Weekly run, Monday 06:00 UTC, to catch newly disclosed CVEs.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit (App and App_Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            App/package-lock.json
            App_Test/package-lock.json

      - name: Audit App dependencies
        working-directory: App
        run: npm audit --audit-level=high || true

      - name: Audit App_Test dependencies
        working-directory: App_Test
        run: npm audit --audit-level=high || true

  gitleaks:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # No paid token required for public repositories.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  iac-scan:
    name: IaC scan (Checkov - placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Terraform
        id: detect
        run: |
          if [ -d "infra/terraform" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Checkov on Terraform
        if: steps.detect.outputs.found == 'true'
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          soft_fail: true

      - name: Skip Checkov (no Terraform yet)
        if: steps.detect.outputs.found == 'false'
        run: echo "No infra/terraform/ directory found, skipping Checkov."
