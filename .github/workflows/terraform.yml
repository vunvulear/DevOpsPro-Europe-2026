# Terraform validate (always) + plan (skip-clean if Azure vars unset).
# Task: T5.1. Constitution: P-II (OIDC), P-III (skip-clean).

name: terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init (no backend)
        run: terraform init -backend=false
      - name: validate
        run: terraform validate

  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: init
        run: terraform init
      - name: plan
        id: plan
        run: |
          terraform plan -var-file=environments/dev.tfvars -out=tfplan -no-color | tee plan.txt
      - name: Render plan as PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          path: infra/terraform/plan.txt
