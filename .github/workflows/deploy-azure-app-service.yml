name: Deploy to Azure App Service

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev/test/prod)."
        required: true
        default: "dev"
      app_url:
        description: "Override App Service URL (optional, e.g. https://app-...azurewebsites.net)."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write   # Azure OIDC

jobs:
  deploy:
    name: Build and deploy (Node.js)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: App/package-lock.json

      - name: Install production dependencies
        working-directory: App
        run: npm ci --omit=dev

      - name: Package app
        run: |
          cd App
          zip -r ../app.zip . -x "*.git*" "node_modules/.cache/*"
          cd ..
          ls -lh app.zip

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name:        ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group:  ${{ vars.AZURE_RESOURCE_GROUP }}
          package:         app.zip

      - name: Resolve target URL
        id: target
        run: |
          if [ -n "${{ inputs.app_url }}" ]; then
            echo "url=${{ inputs.app_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ vars.AZURE_WEBAPP_URL }}" ]; then
            echo "url=${{ vars.AZURE_WEBAPP_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test
        if: steps.target.outputs.url != ''
        run: |
          set -euo pipefail
          BASE="${{ steps.target.outputs.url }}"
          echo "Smoke testing $BASE"
          curl --fail --silent --show-error --max-time 30 "$BASE/" > /dev/null
          curl --fail --silent --show-error --max-time 30 "$BASE/sunset" > /dev/null
          echo "Smoke tests passed."

      - name: Skip smoke test (no URL configured)
        if: steps.target.outputs.url == ''
        run: echo "No AZURE_WEBAPP_URL set and no app_url input - skipping smoke test."
